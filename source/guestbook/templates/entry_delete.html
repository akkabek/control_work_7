{% extends 'base.html' %}

{% block title %}Удалить запись{% endblock %}

{% block content %}
<div class="card my-5">
    <div class="card-header fs-4 text-center py-3">Удалить запись</div>
    <div class="card-body">
        <p>Для удаления введите Email <strong>{{ entry.author }}</strong></p>
        <form method="POST" action="">
            {% csrf_token %}
            <p>{% include 'partial/email_verification_form.html' %}</p>
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
