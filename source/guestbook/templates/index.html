{% extends 'base.html' %}

{% block title %}
Гостевая книга
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">

    <h1 class="mb-0">Гостевая книга</h1>

<form method="GET" action="" class="mb-3 d-flex gap-2">

    <input type="text" name="query" class="form-control w-auto"
           placeholder="Поиск по имени автора"
           value="{{ request.GET.query }}">
    <button type="submit" class="btn btn-outline-primary">Найти</button>
</form>
</div>

<h5 class="mb-3">Добавить запись</h5>
<div class="card mb-4">
    <div class="card-body">
        <form method="POST" action="{% url 'add' %}">
            {% include 'partial/entry_form.html' %}
            <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
    </div>
</div>

{% for entry in entries %}
    <div class="card mb-3">
        <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <strong>{{ entry.author }}</strong>
                <span class="text-muted">({{ entry.email }})</span>
            </div>
            <div class="d-flex gap-2">
                <a href="{% url 'edit' entry.pk %}" class="btn btn-sm btn-outline-warning">
                    <i class="fa-regular fa-pen-to-square"></i>
                </a>
                <a href="{% url 'delete' entry.pk %}" class="btn btn-sm btn-outline-danger">
                    <i class="fa-regular fa-trash-can"></i>
                </a>
            </div>
        </div>
        <p class="mt-2 mb-0">{{ entry.content }}</p>
    </div>
</div>
{% endfor %}
{% endblock %}
